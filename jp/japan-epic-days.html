<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本の四季・絶景セレクション | 映えるトラベル&グルメ</title>
<meta name="description" content="日本各地の祭りと絶景を、季節ごとに地図で紹介。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#f4efe3; --washi-deep:#ece3d0; --sumi:#1e2222; --aiiro:#1c3a5e; --aiiro-deep:#122740;
    --shu:#c1440e; --shu-deep:#9c350a; --gold:#b8862f; --line:#d8cdb2; --radius:2px;
    --font-display:'Shippori Mincho', serif; --font-body:'Noto Sans JP', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--washi);background-image:radial-gradient(circle at 15% 10%, rgba(28,58,94,0.05), transparent 45%),radial-gradient(circle at 90% 80%, rgba(193,68,14,0.06), transparent 40%);color:var(--sumi);font-family:var(--font-body);line-height:1.8;}
  a{color:inherit;}
  header{padding:40px 6vw 28px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:4px;}
  .brand .mark{width:34px;height:34px;min-width:34px;flex:none;display:block;}
  .brand .divider{width:1px;height:26px;background:var(--line);flex:none;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,3.6vw,26px);color:var(--shu);line-height:1.1;}
  .brand-name .accent{color:var(--aiiro-deep);}
  .back-link{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;font-weight:700;color:var(--aiiro-deep);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;}
  .back-link:hover{color:var(--shu);border-color:var(--shu);}
  main{max-width:1100px;margin:0 auto;padding:48px 6vw 80px;}
  .eyebrow{font-size:12px;letter-spacing:0.12em;color:var(--gold);font-weight:700;margin-bottom:8px;}
  h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5vw,42px);color:var(--aiiro-deep);margin:0 0 10px;}
  .page-lede{font-size:15px;color:#5a5f5f;max-width:640px;margin-bottom:36px;}

  .map-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;margin-bottom:32px;}
  .japan-map-svg{width:100%;height:auto;max-width:760px;display:block;margin:0 auto;}
  .jmap-pref{fill:var(--washi-deep);stroke:var(--line);stroke-width:1;}
  .festival-pin{cursor:pointer;opacity:0;transition:opacity .3s ease;}
  .festival-pin.is-visible{opacity:1;}
  .festival-pin-leader{stroke:#9a9488;stroke-width:1.5;stroke-dasharray:3 3;}
  .festival-pin-marker{fill:var(--pin-color);stroke:#fff;stroke-width:1.5;}
  .festival-pin:hover .festival-pin-leader, .festival-pin.is-active .festival-pin-leader{stroke:var(--shu);}
  .festival-pin:hover .festival-pin-marker, .festival-pin.is-active .festival-pin-marker{fill:var(--shu);}
  .festival-pin-ring{fill:none;stroke:#fff;stroke-width:3.5;filter:drop-shadow(0 2px 5px rgba(30,34,34,0.4));}
  .festival-pin:hover .festival-pin-ring, .festival-pin.is-active .festival-pin-ring{stroke:var(--shu);}
  .festival-pin-badge-bg{fill:var(--pin-color);stroke:#fff;stroke-width:1.5;}
  .festival-pin-num{font-family:var(--font-body);font-weight:700;font-size:13px;fill:#fff;text-anchor:middle;}

  .season-tabs{display:flex;gap:10px;justify-content:center;margin:0 0 22px;flex-wrap:wrap;}
  .season-tab{
    font-family:var(--font-body);font-size:15px;font-weight:700;color:#5a5f5f;background:#fff;
    border:1px solid var(--line);border-radius:20px;padding:9px 22px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .15s ease;
  }
  .season-tab-months{font-size:10.5px;font-weight:400;opacity:0.7;}
  .season-tab:hover{border-color:var(--season-color);color:var(--season-color);}
  .season-tab.is-active{background:var(--season-color);border-color:var(--season-color);color:#fff;}

  .region-block{margin-bottom:32px;}
  .region-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .region-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .region-title{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--aiiro-deep);}
  .region-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:700px){.region-cards{grid-template-columns:1fr;}}

  .festival-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;scroll-margin-top:20px;transition:box-shadow .2s ease;}
  .festival-card.is-highlight{box-shadow:0 0 0 3px var(--shu);}
  .festival-photo{position:relative;aspect-ratio:3/2;overflow:hidden;background:linear-gradient(135deg,var(--aiiro),var(--aiiro-deep));display:flex;align-items:center;justify-content:center;color:#fff;}
  .festival-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .festival-photo .ph-icon{font-size:30px;opacity:0.8;}
  .festival-photo .pin-num-badge{
    position:absolute;top:10px;left:10px;background:var(--pin-color);color:#fff;font-weight:700;font-size:13px;
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);z-index:2;
  }
  .festival-body{padding:18px 20px 20px;}
  .festival-month{font-size:12px;font-weight:700;letter-spacing:0.02em;color:var(--shu);margin-bottom:5px;}
  .festival-name{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--aiiro-deep);margin-bottom:3px;line-height:1.35;}
  .festival-pref{font-size:12.5px;color:#7a7f75;margin-bottom:9px;}
  .festival-desc{font-size:13.5px;color:#454a45;margin:0 0 11px;}
  .festival-yt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--shu);text-decoration:none;border-bottom:1px solid var(--shu);padding-bottom:1px;}
  .festival-yt:hover{color:var(--shu-deep);border-color:var(--shu-deep);}
  .festival-noyt{font-size:12px;color:#9a9488;}
</style>
</head>

: "10月下旬〜11月中旬", "desc": "奇岩と渓谷を鮮やかな紅葉が彩る、日本屈指の渓谷美。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/shosenkyo.jpg", "yt": "eGTueuzP1Bo", "dir": 270, "mx": 571.1, "my": 653.1, "cx": 115, "cy": 560, "region": "chubu", "regionColor": "#b8862f"}, {"id": "kumoba-autumn", "name": "雲場池(軽井沢)", "pref": 20, "prefName": "長野", "season": "autumn", "month": "10月中旬〜下旬", "desc": "紅葉した木々が湖面に映り込む、軽井沢を代表する秋の絶景。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/kumoba.jpg", "yt": null, "dir": 330, "mx": 567.3, "my": 614.9, "cx": 115, "cy": 730, "region": "chubu", "regionColor": "#b8862f"}, {"id": "arashiyama-autumn", "name": "嵐山(京都)", "pref": 26, "prefName": "京都", "season": "autumn", "month": "11月中旬〜下旬", "desc": "渡月橋と山々を彩る紅葉が美しい、京都を代表する秋の名所。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/arashiyama.jpg", "yt": null, "dir": 270, "mx": 417.4, "my": 698.9, "cx": 935, "cy": 980, "region": "kinki", "regionColor": "#7a3b8c"}, {"id": "abashiri-ice", "name": "網走 流氷観光砕氷船", "pref": 1, "prefName": "北海道", "season": "winter", "month": "1月下旬〜3月中旬", "desc": "一面の流氷をかき分けて進む、北海道ならではの壮大な冬の絶景。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/abashiri.jpg", "yt": null, "dir": 40, "mx": 955.0, "my": 95.0, "cx": 935, "cy": 130, "region": "hokkaido", "regionColor": "#1c3a5e"}, {"id": "sapporo-snow-fes", "name": "さっぽろ雪まつり", "pref": 1, "prefName": "北海道", "season": "winter", "month": "2月上旬", "desc": "巨大な雪氷像が街を彩る、世界的にも有名な冬の祭典。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/yukimatsuri.jpg", "yt": null, "dir": 180, "mx": 729.0, "my": 179.2, "cx": 935, "cy": 300, "region": "hokkaido", "regionColor": "#1c3a5e"}, {"id": "asahiyama-penguin", "name": "旭山動物園 ペンギンの散歩", "pref": 1, "prefName": "北海道", "season": "winter", "month": "12月中旬〜3月下旬", "desc": "雪の上をよちよち歩くペンギンたちを間近で楽しめる、冬限定の人気イベント。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/asahiyama.jpg", "yt": "aAmnFHSuhpM", "dir": 270, "mx": 799.5, "my": 130.4, "cx": 935, "cy": 470, "region": "hokkaido", "regionColor": "#1c3a5e"}, {"id": "yokote-kamakura-fes", "name": "横手のかまくら", "pref": 5, "prefName": "秋田", "season": "winter", "month": "2月15日〜16日", "desc": "雪で作られたかまくらが街を彩る、約450年続く秋田の伝統行事。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/yokotekamakura.jpg", "yt": null, "dir": 270, "mx": 662.4, "my": 420.9, "cx": 935, "cy": 640, "region": "tohoku", "regionColor": "#2f6690"}, {"id": "yamadera-winter", "name": "山寺(山形)", "pref": 6, "prefName": "山形", "season": "winter", "month": "1月〜2月", "desc": "雪に包まれた山寺の静寂と、雪景色が織りなす荘厳な冬の絶景。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/yamadera.jpg", "yt": "LfdfOwSTKK8", "dir": 60, "mx": 648.0, "my": 484.0, "cx": 935, "cy": 810, "region": "tohoku", "regionColor": "#2f6690"}, {"id": "zao-snowmonster", "name": "蔵王の樹氷", "pref": 6, "prefName": "山形", "season": "winter", "month": "1月下旬〜3月上旬", "desc": "巨大な樹氷が山一面に連なる、世界的にも珍しい冬の絶景。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/snowmonster.jpg", "yt": "LB1LIzUcRO8", "dir": 180, "mx": 660.0, "my": 508.0, "cx": 935, "cy": 980, "region": "tohoku", "regionColor": "#2f6690"}, {"id": "togakushi-winter", "name": "戸隠神社", "pref": 20, "prefName": "長野", "season": "winter", "month": "12月〜2月", "desc": "深い雪に覆われた杉並木と社殿が織りなす、神秘的で荘厳な冬景色。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/togakushi.jpg", "yt": "lQ9n1yn9S54", "dir": 270, "mx": 531.0, "my": 585.0, "cx": 115, "cy": 560, "region": "chubu", "regionColor": "#b8862f"}, {"id": "jigokudani-snowmonkey", "name": "地獄谷野猿公苑 スノーモンキー", "pref": 20, "prefName": "長野", "season": "winter", "month": "12月〜3月", "desc": "雪景色の中、温泉に浸かるニホンザルを間近で見られる世界的に有名な冬の名所。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/snowmonkey.jpg", "yt": "KsCg8Iz6P2s", "dir": 90, "mx": 566.0, "my": 596.0, "cx": 115, "cy": 730, "region": "chubu", "regionColor": "#b8862f"}, {"id": "kouri-winter", "name": "古宇利島(沖縄)", "pref": 47, "prefName": "沖縄", "season": "winter", "month": "12月〜2月(温暖)", "desc": "エメラルドグリーンの海がどこまでも広がる。真冬でも東京より11℃暖かい。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/okinawa.jpg", "yt": "Z-efLUnEm_A", "dir": 180, "mx": 343.7, "my": 202.4, "cx": 115, "cy": 130, "region": "kyushu-okinawa", "regionColor": "#a3324a"}, {"id": "takachiho-autumn", "name": "高千穂峡", "pref": 45, "prefName": "宮崎", "season": "autumn", "month": "11月中旬〜12月上旬", "desc": "切り立つ柱状節理と清流を紅葉が彩る神話の里の絶景。", "img": "https://pub-7806a0647a9943448e15f9e00f8ed59e.r2.dev/images/epicseasons/takachiho.jpg", "yt": "qlWJvOXW_jY", "dir": 180, "mx": 184.5, "my": 832.1, "cx": 115, "cy": 900, "region": "kyushu-okinawa", "regionColor": "#a3324a"}];
const REGION_LABELS = {"hokkaido": "北海道 — 氷と雪", "tohoku": "東北 — ねぶたと熱狂", "kanto": "関東 — 東京近郊の伝統", "chubu": "中部 — クールな日本アルプス", "kinki": "近畿 — 古の伝統", "shikoku": "四国 — 踊りと炎", "kyushu-okinawa": "沖縄 — 南国への逃避行"};
const SEASON_REGION_LABELS = {"spring": {"tohoku": "東北 — 桜の絶景", "kanto": "関東 — 春の花の楽園", "chubu": "中部 — 春と雪の共演"}, "summer": {"tohoku": "東北 — 迫力の夏祭り", "chubu": "中部 — 雄大なアルプスの避暑地", "kinki": "近畿 — 時代を超えて受け継がれる伝統", "shikoku": "四国 — 歴史を紡ぐ情熱の踊り"}, "autumn": {"tohoku": "東北 — 森を彩る秋", "kanto": "関東 — 大自然と名庭園の紅葉", "chubu": "中部 — 秋の水鏡", "kinki": "近畿 — 千年の都の茜色の秋景色", "kyushu-okinawa": "九州 — 黄金の渓谷"}, "winter": {"hokkaido": "北海道 — 雪と氷の幻想世界", "tohoku": "東北 — 究極の雪景色", "chubu": "中部 — 冬の神秘"}};
const CARD_W = 210, CARD_H = 148;
const MARKER_R = 6;

function esc(s){ return s.replace(/&/g,'&amp;'); }

function renderSeason(season){
  document.querySelectorAll('.season-tab').forEach(t => t.classList.toggle('is-active', t.dataset.season === season));

  const items = PINS.filter(f => f.season === season);
  items.forEach((f, i) => f.num = i + 1);

  const clipsEl = document.getElementById('pinClips');
  clipsEl.innerHTML = items.map(f => `<clipPath id="clip-${f.id}"><rect x="${f.cx-CARD_W/2}" y="${f.cy-CARD_H/2}" width="${CARD_W}" height="${CARD_H}" rx="8"/></clipPath>`).join('');

  const pinsG = document.getElementById('festivalPins');
  pinsG.innerHTML = items.map(f => `
    <g class="festival-pin is-visible" data-id="${f.id}" style="--pin-color:${f.regionColor}">
      <line class="festival-pin-leader" x1="${f.mx}" y1="${f.my}" x2="${f.cx}" y2="${f.cy}"/>
      <circle class="festival-pin-marker" cx="${f.mx}" cy="${f.my}" r="${MARKER_R}"/>
      <rect x="${f.cx-CARD_W/2}" y="${f.cy-CARD_H/2}" width="${CARD_W}" height="${CARD_H}" fill="transparent"/>
      <image href="${f.img}" x="${f.cx-CARD_W/2}" y="${f.cy-CARD_H/2}" width="${CARD_W}" height="${CARD_H}" clip-path="url(#clip-${f.id})" preserveAspectRatio="xMidYMid slice"/>
      <rect class="festival-pin-ring" x="${f.cx-CARD_W/2}" y="${f.cy-CARD_H/2}" width="${CARD_W}" height="${CARD_H}" rx="8"/>
      <circle class="festival-pin-badge-bg" cx="${f.cx-CARD_W/2+16}" cy="${f.cy-CARD_H/2+16}" r="13"/>
      <text class="festival-pin-num" x="${f.cx-CARD_W/2+16}" y="${f.cy-CARD_H/2+20.5}">${f.num}</text>
    </g>
  `).join('');

  document.querySelectorAll('.festival-pin').forEach(pin => {
    pin.addEventListener('click', () => {
      const card = document.getElementById('card-' + pin.dataset.id);
      if(card){
        card.scrollIntoView({behavior:'smooth', block:'center'});
        card.classList.add('is-highlight');
        setTimeout(()=> card.classList.remove('is-highlight'), 1600);
      }
    });
  });

  const regionOrder = [];
  const byRegion = {};
  items.forEach(f => {
    if(!byRegion[f.region]){ byRegion[f.region] = []; regionOrder.push(f.region); }
    byRegion[f.region].push(f);
  });

  const blocks = document.getElementById('regionBlocks');
  blocks.innerHTML = regionOrder.map(region => {
    const list = byRegion[region];
    const color = list[0].regionColor;
    const cards = list.map(f => `
      <div class="festival-card" id="card-${f.id}">
        <div class="festival-photo">
          <span class="pin-num-badge" style="--pin-color:${color}">${f.num}</span>
          <span class="ph-icon">📷</span>
          <img src="${f.img}" alt="${esc(f.name)}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="festival-body">
          <div class="festival-month">${f.month} ・ ${f.prefName}</div>
          <div class="festival-name">${esc(f.name)}</div>
          <p class="festival-desc">${f.desc}</p>
          ${f.yt ? `<a class="festival-yt" href="https://www.youtube.com/watch?v=${f.yt}" target="_blank" rel="noopener">▶ YouTubeで見る</a>` : `<span class="festival-noyt">動画は準備中です</span>`}
        </div>
      </div>
    `).join('');
    return `
      <div class="region-block">
        <div class="region-header">
          <span class="region-dot" style="background:${color}"></span>
          <span class="region-title">${(SEASON_REGION_LABELS[season] && SEASON_REGION_LABELS[season][region]) || REGION_LABELS[region]}</span>
        </div>
        <div class="region-cards">${cards}</div>
      </div>
    `;
  }).join('');
}

document.querySelectorAll('.season-tab').forEach(tab => {
  tab.addEventListener('click', () => renderSeason(tab.dataset.season));
});

function getCurrentSeason(){
  const month = new Date().getMonth() + 1;
  if (month >= 3 && month <= 5) return 'spring';
  if (month >= 6 && month <= 8) return 'summer';
  if (month >= 9 && month <= 11) return 'autumn';
  return 'winter';
}

renderSeason(getCurrentSeason());
</script>
